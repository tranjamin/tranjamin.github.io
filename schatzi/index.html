        function getSearchData(){
          let searchString = location.search;
            if (searchString){
                let obj = {};
                searchString = searchString.substring(1, searchString.length);
                let tempArray = searchString.split('&');
                tempArray.forEach(item => {
                    obj[item.split('=')[0]] = decodeURIComponent(item.split('=')[1]);
                });
                return obj;
            } else {
                return false;

<script>
const images = document.querySelectorAll(".img");
let index = 0;

function showNext() {
  if (index >= images.length - 1) return;

  // fade current out
  images[index].classList.remove("active");
  index++;

  // fade next in
  setTimeout(() => {
    images[index].classList.add("active");

    // auto fade out after 2s
    setTimeout(() => {
      images[index].classList.remove("active");

      // if more images → continue
      if (index < images.length - 1) {
        index++;
        setTimeout(() => {
          images[index].classList.add("active");

          setTimeout(() => {
            images[index].classList.remove("active");
            document.getElementById('textstage').style.visibility = "visible";
            document.getElementById('textstage').classList.add("fade-text");
          }, 2000);

        }, 0);
      }
    }, 2000);

  }, 0);
}

images[0].addEventListener('click', showNext);
images[1].addEventListener('click', showNext);
images[2].addEventListener('click', showNext);

    title2.classList.add("scrolled");
    title3.classList.add("scrolled");
  } else {
    title1.classList.remove("scrolled");
    title2.classList.remove("scrolled");
    title3.classList.remove("scrolled");
  }
});
